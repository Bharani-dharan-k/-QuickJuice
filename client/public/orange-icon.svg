<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="orangeGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b00;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Orange body -->
  <circle cx="50" cy="55" r="35" fill="url(#orangeGradient)" />
  
  <!-- Orange texture (dots) -->
  <circle cx="40" cy="50" r="1.5" fill="#ff8c00" opacity="0.6" />
  <circle cx="55" cy="48" r="1.5" fill="#ff8c00" opacity="0.6" />
  <circle cx="45" cy="60" r="1.5" fill="#ff8c00" opacity="0.6" />
  <circle cx="60" cy="55" r="1.5" fill="#ff8c00" opacity="0.6" />
  <circle cx="38" cy="62" r="1.5" fill="#ff8c00" opacity="0.6" />
  
  <!-- Leaf -->
  <ellipse cx="50" cy="25" rx="8" ry="15" fill="#4caf50" transform="rotate(-20 50 25)" />
  
  <!-- Leaf vein -->
  <line x1="50" y1="20" x2="50" y2="32" stroke="#2e7d32" stroke-width="1" transform="rotate(-20 50 25)" />
  
  <!-- Highlight -->
  <ellipse cx="40" cy="45" rx="12" ry="8" fill="#fff" opacity="0.3" transform="rotate(-30 40 45)" />
</svg>
